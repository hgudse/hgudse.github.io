name: Build & Deploy

on:
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        env:
          SITE_URL: https://hltx.eu.cc
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Commit dist to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r dist/* .
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: auto rebuild $(date -u '+%Y-%m-%d %H:%M')"
          git push
